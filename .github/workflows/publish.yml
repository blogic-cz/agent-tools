name: Release and Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run check ci

  publish:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install

      - name: Update version from tag
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Publish to npm with OIDC
        shell: bash
        run: |
          set -euo pipefail

          NPM=(npx -y npm@11.5.1)
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          is_published() {
            [ "$("${NPM[@]}" view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]
          }

          "${NPM[@]}" --version

          if is_published; then
            echo "${PACKAGE_NAME}@${VERSION} is already published. Skipping publish."
            exit 0
          fi

          ATTEMPTS=3
          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "Publish attempt ${attempt}/${ATTEMPTS} for ${PACKAGE_NAME}@${VERSION}"

            set +e
            PUBLISH_OUTPUT=$("${NPM[@]}" publish --access public --provenance 2>&1)
            PUBLISH_STATUS=$?
            set -e

            printf '%s\n' "$PUBLISH_OUTPUT"

            if [ "$PUBLISH_STATUS" -eq 0 ]; then
              exit 0
            fi

            for verify_attempt in 1 2 3; do
              sleep 10

              if is_published; then
                echo "${PACKAGE_NAME}@${VERSION} became visible on npm after a failed publish exit code. Continuing."
                exit 0
              fi

              echo "Publish verification ${verify_attempt}/3 did not find ${PACKAGE_NAME}@${VERSION} on npm yet."
            done

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "Publish attempt ${attempt} failed and version is still not on npm. Retrying in 15 seconds."
              sleep 15
            fi
          done

          echo "Failed to publish ${PACKAGE_NAME}@${VERSION} after ${ATTEMPTS} attempts."
          exit "$PUBLISH_STATUS"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "## What's Changed" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "**Full Changelog**: https://github.com/blogic-cz/agent-tools/compare/${PREVIOUS_TAG}...${{ steps.tag.outputs.tag }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
